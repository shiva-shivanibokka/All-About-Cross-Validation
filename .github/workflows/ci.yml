name: CI

# Runs on every push to main and every PR. Two independent jobs:
#   web       — typecheck + production build of the Next.js visualizer (fully deterministic)
#   notebooks — install deps, self-check the datasets, execute all 5 notebooks with a
#               0-error gate, then prove the visualizer cites what those notebooks computed.
#
# Nothing the site shows is taken on trust; each number is checked back to the code that
# produced it, in two hops, because one hop alone proves nothing:
#   notebooks → HEADLINE  each notebook calls cv_datasets.record_headline() where it computes
#                         a number; export_web_artifacts.py compares its constants against that
#                         record, within one unit of the constant's last decimal place.
#   code → web/public/  --check recomputes every artifact and compares it against the committed
#                       file rather than overwriting it, so a stale artifact fails the build.
# Both hops compare numerically with a tolerance, so thread-count and BLAS noise in the model
# fits cannot turn a legitimate build red, while any drift the site could render is caught.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  notebooks:
    name: Notebooks + artifacts — Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Datasets are fetched once from OpenML/UCI and cached, so later runs need no network.
      - name: Cache datasets
        uses: actions/cache@v4
        with:
          path: ~/scikit_learn_data
          key: sklearn-data-v1

      # Prefetch + validate the datasets. Retry to absorb transient upstream hiccups so the
      # badge doesn't flip red on a momentary OpenML/UCI blip.
      - name: Fetch datasets + self-check
        run: |
          for i in 1 2 3; do
            python cv_datasets.py && exit 0
            echo "attempt $i failed — retrying in 15s"; sleep 15
          done
          exit 1

      # Execute every notebook top-to-bottom. nbconvert --execute exits non-zero on any cell
      # error, so this is the "0-error gate". Output goes to a temp dir so the repo stays clean.
      - name: Execute notebooks (0-error gate)
        run: |
          for nb in 01_foundations_and_leakage 02_the_kfold_family 03_grouped_and_time_aware 04_model_selection 05_resampling_and_curves; do
            echo "::group::executing $nb"
            jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=600 \
              --ExecutePreprocessor.kernel_name=python3 \
              --output-dir "$RUNNER_TEMP" "$nb.ipynb"
            echo "::endgroup::"
          done

      # Executing the notebooks above wrote _notebook_headline.json via record_headline().
      # Without it the export's check silently skips, so the gate would pass by doing nothing.
      - name: Assert the notebooks recorded their headline numbers
        run: |
          if [ ! -f _notebook_headline.json ]; then
            echo "::error::_notebook_headline.json was not produced. The notebooks must call"
            echo "cv_datasets.record_headline() for every section the visualizer cites."
            exit 1
          fi
          cat _notebook_headline.json

      # The check with teeth. --check recomputes every artifact and compares it against the
      # committed one instead of overwriting it. The comparison is numeric with a small
      # tolerance, because charts.json comes from real model fits whose last float bits move
      # with BLAS and thread count; headline.json and folds.json are constants and integer fold
      # indices, so they match exactly and the tolerance never bites. Regenerating and then
      # diffing would compare the output to itself and could never fail.
      - name: Assert committed artifacts match what the code computes
        run: python scripts/export_web_artifacts.py --check
