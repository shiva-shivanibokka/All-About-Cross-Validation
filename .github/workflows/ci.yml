name: CI

# Runs on every push to main and every PR. Two independent jobs:
#   web       — typecheck + production build of the Next.js visualizer (fully deterministic)
#   notebooks — install deps, self-check the datasets, execute all 5 notebooks with a
#               0-error gate, then prove the visualizer cites what those notebooks computed.
#
# The headline numbers are checked in two hops, because one hop alone proves nothing:
#   notebooks → HEADLINE  each notebook calls cv_datasets.record_headline() where it computes
#                         a number; export_web_artifacts.py compares its constants against that
#                         record, within one unit of the constant's last decimal place.
#   HEADLINE  → headline.json  the committed artifact must be regenerated from those constants.
# Only the first hop touches computed values, and it compares with a tolerance, so thread-count
# and BLAS noise in the model fits cannot turn a legitimate build red. The second hop is a byte
# diff of a file written from pure Python constants, deterministic on every platform.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  notebooks:
    name: Notebooks + artifacts — Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Datasets are fetched once from OpenML/UCI and cached, so later runs need no network.
      - name: Cache datasets
        uses: actions/cache@v4
        with:
          path: ~/scikit_learn_data
          key: sklearn-data-v1

      # Prefetch + validate the datasets. Retry to absorb transient upstream hiccups so the
      # badge doesn't flip red on a momentary OpenML/UCI blip.
      - name: Fetch datasets + self-check
        run: |
          for i in 1 2 3; do
            python cv_datasets.py && exit 0
            echo "attempt $i failed — retrying in 15s"; sleep 15
          done
          exit 1

      # Execute every notebook top-to-bottom. nbconvert --execute exits non-zero on any cell
      # error, so this is the "0-error gate". Output goes to a temp dir so the repo stays clean.
      - name: Execute notebooks (0-error gate)
        run: |
          for nb in 01_foundations_and_leakage 02_the_kfold_family 03_grouped_and_time_aware 04_model_selection 05_resampling_and_curves; do
            echo "::group::executing $nb"
            jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=600 \
              --ExecutePreprocessor.kernel_name=python3 \
              --output-dir "$RUNNER_TEMP" "$nb.ipynb"
            echo "::endgroup::"
          done

      # Executing the notebooks above wrote _notebook_headline.json via record_headline().
      # Without it the export's check silently skips, so the gate would pass by doing nothing.
      - name: Assert the notebooks recorded their headline numbers
        run: |
          if [ ! -f _notebook_headline.json ]; then
            echo "::error::_notebook_headline.json was not produced. The notebooks must call"
            echo "cv_datasets.record_headline() for every section the visualizer cites."
            exit 1
          fi
          cat _notebook_headline.json

      # This is the check with teeth: export_web_artifacts.py compares its hand-transcribed
      # HEADLINE constants against what the notebooks just computed, and exits non-zero if the
      # site would cite a number its own notebook no longer produces.
      - name: Regenerate web artifacts (fails if HEADLINE drifted from the notebooks)
        run: python scripts/export_web_artifacts.py

      # Belt and braces: HEADLINE agreeing with the notebooks is worth nothing if the committed
      # headline.json was never regenerated from it. Constants only, so this diff is
      # deterministic across platforms.
      - name: Assert committed headline.json was regenerated
        run: |
          if ! git diff --quiet -- web/public/headline.json; then
            echo "::error::web/public/headline.json is stale versus the HEADLINE constants in scripts/export_web_artifacts.py."
            echo "Fix: run 'python scripts/export_web_artifacts.py' and commit the result."
            git --no-pager diff -- web/public/headline.json
            exit 1
          fi
          echo "headline.json matches HEADLINE, and HEADLINE matches the notebooks."
